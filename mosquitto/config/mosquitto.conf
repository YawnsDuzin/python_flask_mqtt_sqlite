#============================
# docker-compose.yml에서 Docker 컨테이너로 Mosquitto MQTT 브로커를 실행할 때 사용됩니다.
#============================

# Mosquitto 설정 파일
# 개발 환경용 기본 설정

# 기본 MQTT 리스너
listener 1883

# WebSocket 리스너 (웹 클라이언트용)
listener 9001
protocol websockets

# 익명 접속 허용 (개발용)
# 운영 환경에서는 false로 설정하고 password_file 사용
allow_anonymous true

# 로그 설정
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# 타임스탬프 포함
log_timestamp true

# 데이터 영속성
persistence true
persistence_location /mosquitto/data/

# 연결 설정
max_connections -1
max_keepalive 65535
